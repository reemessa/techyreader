<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفّ الناشرين — The Techy Reader</title>
<meta name="description" content="دوّر الرف، وشوف أي دار نشر بتطلعلك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #F5EDE4;
    --card: #FFFCF8;
    --ink: #2B1C16;
    --muted: #5A4038;
    --faint: #8A6C60;
    --line: #E6D5C8;
    --accent: #9C4A2F;
    --spin: 5.5s;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-reduced-motion: reduce) { :root { --spin: 0.35s; } }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Cairo', system-ui, sans-serif;
    min-height: 100%;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 22px 64px; text-align: center; }

  h1 {
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: clamp(30px, 9vw, 40px);
    color: var(--accent);
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .lede { margin: 0 0 30px; font-size: 15px; line-height: 1.8; color: var(--muted); }

  /* The shelf. Laid out left-to-right internally so the slide maths stays
     simple; the spines themselves are vertical text, so it reads the same. */
  .shelf {
    position: relative;
    height: 232px;
    overflow: hidden;
    direction: ltr;
    background: linear-gradient(#EFE3D7, #E8D8C9);
    border-radius: 12px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }
  .strip {
    position: absolute;
    left: 0;
    bottom: 14px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    will-change: transform;
  }
  .strip.go { transition: transform var(--spin) cubic-bezier(0.22, 0.6, 0.12, 1); }
  .spine {
    flex: 0 0 40px;
    writing-mode: vertical-rl;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 0;
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    border-radius: 3px 3px 1px 1px;
    background-image:
      linear-gradient(to bottom, transparent 9px, rgba(245,237,228,.45) 9px, rgba(245,237,228,.45) 11px, transparent 11px),
      linear-gradient(to top, transparent 9px, rgba(245,237,228,.45) 9px, rgba(245,237,228,.45) 11px, transparent 11px);
    transition: transform .35s ease;
  }
  /* Long names stop short of the gilt bands and end in "…"; the full
     name is always shown below the shelf. */
  .spine span {
    display: block;
    max-height: 100%;
    min-height: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spine.hit { transform: translateY(-14px); }
  .plank { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--muted); }
  .marker {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 16px solid var(--ink);
    z-index: 2;
  }

  button {
    width: 100%;
    min-height: 54px;
    margin-top: 18px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--ground);
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[disabled] { opacity: 0.6; cursor: default; }

  .result { margin-top: 26px; min-height: 90px; }
  .result .label { font-size: 12px; color: var(--faint); }
  .result .name {
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: clamp(30px, 9vw, 40px);
    font-weight: 700;
    line-height: 1.35;
    color: var(--ink);
    word-break: break-word;
  }
  .result .name.pending { color: #D9C3B4; }
  .result .booth { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .result .booth b { color: var(--accent); font-size: 18px; }

  footer { margin-top: 48px; font-size: 12px; color: var(--faint); line-height: 1.9; }
  footer a { color: var(--ink); }
</style>
</head>

<div class="wrap">

  <p class="lede">دوّر الرف، وشوف أي دار نشر بتطلعلك</p>

  <div class="shelf" id="shelf" aria-hidden="true">
    <span class="marker"></span>
    <div class="strip" id="strip"></div>
    <div class="plank"></div>
  </div>

  <button id="go" type="button">دوّر الرف</button>

  <div class="result" aria-live="polite">
    <div class="label">دار النشر</div>
    <div class="name pending" id="name">—</div>
    <div class="booth" id="booth" hidden>الجناح <b dir="ltr" id="boothCode"></b></div>
  </div>

  <footer>
    رفّ واحد، وكل دور النشر عليه<br>
    <a href="https://instagram.com/reemiii_93" dir="ltr">@reemiii_93</a>
  </footer>

</div>

  // Cloth-spine colours, each with the text colour that reads on it.
  var COLOURS = [

    ['#6F7A5E', '#F5EDE4'], ['#2B1C16', '#F5EDE4'], ['#C7A48A', '#2B1C16'],

  ];

  var PITCH = 43;   // spine width + gap, must match the CSS
  var WIDTH = 40;
  var COUNT = 66;   // spines per spin
  var START = 8;    // where the shelf rests before a spin
  var STOP = 56;    // where it lands
  var KEEP = 8;     // spines either side of the landed one carried into the next spin

  var shelf = document.getElementById('shelf');
  var strip = document.getElementById('strip');
  var go = document.getElementById('go');
  var nameEl = document.getElementById('name');
  var boothEl = document.getElementById('booth');
  var boothCode = document.getElementById('boothCode');

  var books = [];
  var at = START;
  var jitter = 0;

  function rand(n) { return Math.floor(Math.random() * n); }

  function randomBook() {
    var colour = COLOURS[rand(COLOURS.length)];
    var publisher = PUBLISHERS[rand(PUBLISHERS.length)];
    return {
      name: publisher[0],
      booth: publisher[1],
      bg: colour[0],
      fg: colour[1],
      height: 150 + rand(48)
    };
  }

  // Fills the shelf. When `previous` is given, the books around where the
  // last spin stopped move to the resting spot, so nothing visibly jumps.
  function fill(previous) {
    var next = [];
    for (var i = 0; i < COUNT; i++) {
      var carried = previous && Math.abs(i - START) <= KEEP;
      next.push(carried ? previous[i - START + STOP] : randomBook());
    }
    books = next;

    strip.innerHTML = '';
    books.forEach(function (book) {
      var el = document.createElement('div');
      el.className = 'spine';
      var label = document.createElement('span');
      label.textContent = book.name;
      el.appendChild(label);
      el.style.height = book.height + 'px';
      el.style.backgroundColor = book.bg;
      el.style.color = book.fg;
      strip.appendChild(el);
    });
  }

  function offset(i) {
    return shelf.clientWidth / 2 - (i * PITCH + WIDTH / 2) + jitter;
  }

  function place(i) {
    at = i;
    strip.classList.remove('go');
    strip.style.transform = 'translateX(' + offset(i) + 'px)';
  }

  fill(null);
  place(START);

  window.addEventListener('resize', function () {
    if (!go.disabled) place(at);
  });

  go.addEventListener('click', function () {
    if (at === STOP) fill(books);
    place(START);
    void strip.offsetWidth;   // commit the resting position before animating

    jitter = (Math.random() - 0.5) * 22;
    at = STOP;
    strip.classList.add('go');
    strip.style.transform = 'translateX(' + offset(STOP) + 'px)';

    go.disabled = true;
    nameEl.textContent = '…';
    nameEl.classList.add('pending');
    boothEl.hidden = true;
  });

  strip.addEventListener('transitionend', function (e) {
    if (e.target !== strip) return;
    strip.children[STOP].classList.add('hit');
    nameEl.textContent = books[STOP].name;
    nameEl.classList.remove('pending');
    boothCode.textContent = books[STOP].booth;
    boothEl.hidden = !books[STOP].booth;
    go.disabled = false;
  });
})();
