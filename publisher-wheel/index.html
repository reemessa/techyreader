  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Cairo', system-ui, sans-serif;

  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 22px 64px; text-align: center; }

  .lede { margin: 0 0 30px; font-size: 15px; line-height: 1.8; color: var(--muted); }

  /* The shelf. Laid out left-to-right internally so the slide maths stays
     simple; the spines themselves are vertical text, so it reads the same. */
  .shelf {
    position: relative;
    height: 232px;
    overflow: hidden;
    direction: ltr;
    background: var(--forest);
    border-radius: 12px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }
  .strip {
    position: absolute;
    left: 0;
    bottom: 14px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    will-change: transform;
  }
  .spine {
    flex: 0 0 40px;
    writing-mode: vertical-rl;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 0;
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    border-radius: 3px 3px 1px 1px;
    background-image:
      linear-gradient(to bottom, transparent 9px, rgba(255,255,255,.4) 9px, rgba(255,255,255,.4) 11px, transparent 11px),
      linear-gradient(to top, transparent 9px, rgba(255,255,255,.4) 9px, rgba(255,255,255,.4) 11px, transparent 11px);
    transition: transform .35s ease;
  }
  /* Long names stop short of the gilt bands and end in "…"; the full
     name is always shown below the shelf. */
  .spine span {
    display: block;
    max-height: 100%;
    min-height: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spine.hit { transform: translateY(-14px); }
  .plank { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #0A2A1F; border-top: 2px solid var(--gold); }
  .marker {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 16px solid var(--gold);
    z-index: 2;
  }

    ['شركة ميديا بروتك للنشر والتوزيع', 'C37'],

    ['إنسيكلوميديا', 'C41'],
    ['دار الرافدين للطباعة والنشر', 'C42'],
    ['شركة دار الشرق العربي', 'C43'],
    ['الدار العربية للعلوم ناشرون', 'C44'],
    ['مركز اليرموك للتوزيع', 'C45'],
    ['بيت الحكمة', 'C46'],
    ['الاتحاد العام للكتاب والادباء الفلسطينين', '']
  ];

  // Cloth-spine colours, each with the text colour that reads on it.
  var COLOURS = [
    ['#167B54', '#FFFFFF'], ['#3E7D6E', '#FFFFFF'], ['#D9694A', '#201F1D'],
    ['#C79A3E', '#0F3A2B'], ['#EDE6D6', '#0F3A2B'], ['#FFFFFF', '#167B54'],
    ['#1F5A43', '#F5F5F4']
  ];

  var PITCH = 43;   // spine width + gap, must match the CSS
  var WIDTH = 40;
  var START = 8;    // where the shelf rests before a spin
  var KEEP = 8;     // spines either side of the landed one carried into the next spin

  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED = 30 / 1000;               // spines per ms at full speed
  var RAMP = 400;                      // ms to get up to full speed
  var AUTO = REDUCED ? 0 : 10000;      // ms before it stops by itself
  var BRAKE = 1500;                    // roughly how long a stop takes, ms

  // Enough spines to slide at full speed until the auto-stop, brake, and
  // still have books either side of the one it lands on.
  var COUNT = START + Math.ceil(SPEED * (AUTO + BRAKE)) + KEEP + 4;

  var shelf = document.getElementById('shelf');
  var strip = document.getElementById('strip');
  var go = document.getElementById('go');
  var nameEl = document.getElementById('name');
  var boothEl = document.getElementById('booth');
  var boothCode = document.getElementById('boothCode');

  var books = [];
  var at = START;        // shelf position, in spines (fractional while moving)
  var landed = null;     // index of the book the last spin stopped on
  var spin = null;       // the spin in progress, if any

  function rand(n) { return Math.floor(Math.random() * n); }

  function randomBook() {
    var colour = COLOURS[rand(COLOURS.length)];
    var publisher = PUBLISHERS[rand(PUBLISHERS.length)];
    return {
      name: publisher[0],
      booth: publisher[1],
      bg: colour[0],
      fg: colour[1],
      height: 150 + rand(48)
    };
  }

  // Fills the shelf. When `previous` is given, the books around where the
  // last spin stopped move to the resting spot, so nothing visibly jumps.
  function fill(previous, from) {
    var next = [];
    for (var i = 0; i < COUNT; i++) {
      var carried = previous && Math.abs(i - START) <= KEEP;
      next.push(carried ? previous[i - START + from] : randomBook());
    }
    books = next;

    strip.innerHTML = '';
    books.forEach(function (book) {
      var el = document.createElement('div');
      el.className = 'spine';
      var label = document.createElement('span');
      label.textContent = book.name;
      el.appendChild(label);
      el.style.height = book.height + 'px';
      el.style.backgroundColor = book.bg;
      el.style.color = book.fg;
      strip.appendChild(el);
    });
  }

  function place(p) {
    at = p;
    var x = shelf.clientWidth / 2 - (p * PITCH + WIDTH / 2);
    strip.style.transform = 'translateX(' + x + 'px)';
  }

  // Speeds up over RAMP ms, then slides at a steady SPEED until stopped.
  function cruise(t) {
    t = Math.max(0, t);
    if (t < RAMP) return START + 0.5 * (SPEED / RAMP) * t * t;
    return START + 0.5 * SPEED * RAMP + SPEED * (t - RAMP);
  }

  function frame(now) {
    var t = now - spin.began;

    if (spin.brake) {
      var b = spin.brake;
      var s = Math.min(now - b.began, b.duration);
      // Constant deceleration from full speed, reaching zero exactly on
      // the target book.
      place(b.from + b.speed * s - 0.5 * (b.speed / b.duration) * s * s);
      if (s >= b.duration) return finish(b.target);
    } else {
      place(cruise(t));
      // A press during the ramp, or the 10 seconds running out.
      if (t >= RAMP && (spin.stopAsked || t >= AUTO)) stop(now);
    }
    spin.raf = requestAnimationFrame(frame);
  }

  function finish(index) {
    place(index);
    spin = null;
    landed = index;
    strip.children[index].classList.add('hit');
    nameEl.textContent = books[index].name;
    nameEl.classList.remove('pending');
    boothCode.textContent = books[index].booth;
    boothEl.hidden = !books[index].booth;
    go.textContent = 'دوّر الرف';
    go.disabled = false;
  }

  function start() {
    if (landed !== null) fill(books, landed);
    landed = null;
    place(START);

    spin = { began: performance.now(), brake: null, stopAsked: false };
    spin.raf = requestAnimationFrame(frame);

    go.textContent = 'وقّف';
    nameEl.textContent = '…';
    nameEl.classList.add('pending');
    boothEl.hidden = true;
  }

  // Brake from full speed onto a book about BRAKE ms of sliding ahead.
  function stop(now) {
    var target = Math.round(at + SPEED * BRAKE / 2);
    spin.brake = {
      began: now,
      from: at,
      speed: SPEED,
      target: target,
      duration: 2 * (target - at) / SPEED
    };
    go.disabled = true;
  }
  fill(null);
  place(START);

  window.addEventListener('resize', function () {
    if (!spin) place(at);
  });

  go.addEventListener('click', function () {
    if (!spin) start();
    else if (!spin.brake) spin.stopAsked = true;
  });
})();
