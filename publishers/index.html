    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--ground);
    padding: 10px 0 8px;
    margin: 0 -2px;
    padding-inline: 2px;
    border-bottom: 1px solid var(--edge);
  }

  .search { position: relative; display: block; }
  .search input {
    width: 100%;
    height: 50px;
    padding: 0 44px 0 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 12px;
  }
  .search input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .search svg {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 19px;
    height: 19px;
    color: var(--faint);
    pointer-events: none;
  }

  .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

    font-size: 14px;

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {

  var SAVED_KEY = 'publishers:saved';
  var HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.3 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"></path></svg>';

  var input = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var tabs = document.getElementById('tabs');
  var savedTab = document.getElementById('savedTab');

  // Like normalise() in api/word.js, plus ى/ي and tatweel, so "الشروق",
  // "شروق" and "b14" all find what they should.
  function normalise(text) {
    return String(text)
      .toLowerCase()
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var items = PUBLISHERS.map(function (p, i) {
    return {
      id: String(i),
      name: p[0],
      booth: p[1],
      hall: p[1] ? p[1][0] : '',
      key: normalise(p[0] + ' ' + p[1])
    };
  });

  // Hearts are stored by name, so they survive the list being reordered.
  var saved = {};
  try {
    (JSON.parse(localStorage.getItem(SAVED_KEY)) || []).forEach(function (name) { saved[name] = true; });
  } catch (e) {}

  function persist() {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(Object.keys(saved))); }
    catch (e) { /* private mode: hearts last until the page closes */ }
  }

  var filter = 'all';
  var PER_PAGE = 24;   // twelve rows of two cards
  var pageNo = 1;

  var pager = document.getElementById('pager');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var where = document.getElementById('where');

  // Marks the typed text inside a name, when it appears there as typed.
  function highlight(name) {
    var typed = input.value.trim();
    var at = typed ? name.toLowerCase().indexOf(typed.toLowerCase()) : -1;
    if (at < 0) return esc(name);
    return esc(name.slice(0, at)) + '<mark>' + esc(name.slice(at, at + typed.length)) + '</mark>' +
      esc(name.slice(at + typed.length));
  }

  function heartButton(item) {
    var on = !!saved[item.name];
    return '<button type="button" class="heart" data-id="' + item.id + '" aria-pressed="' + on + '" aria-label="' +
      (on ? 'شيل من قائمتي' : 'ضيف لقائمتي') + '">' + HEART + '</button>';
  }

  function card(item) {
    var booth = item.booth
      ? '<span class="booth"><small>جناح </small><span dir="ltr">' + esc(item.booth) + '</span></span>'
      : '<span></span>';
    return '<div class="card"><div class="name">' + highlight(item.name) + '</div>' +
      '<div class="foot">' + booth + heartButton(item) + '</div></div>';
  }

  function updateSavedTab() {
    var n = Object.keys(saved).length;
    savedTab.textContent = 'قائمتي' + (n ? ' (' + n + ')' : '');
  }

  // A new search or filter starts again at page 1; `keepPage` is for
  // re-drawing the same view (turning a page, un-hearting in قائمتي).
  function render(keepPage) {
    if (keepPage !== true) pageNo = 1;
    var q = normalise(input.value);
    var shown = items.filter(function (item) {
      if (filter === 'saved' && !saved[item.name]) return false;
      if (filter.length === 1 && item.hall !== filter) return false;
      return !q || item.key.indexOf(q) >= 0;
    });

    updateSavedTab();
    count.textContent = shown.length + ' من ' + items.length + ' دار نشر';

    var pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
    pageNo = Math.min(pageNo, pages);
    pager.hidden = pages < 2;
    prev.disabled = pageNo === 1;
    next.disabled = pageNo === pages;
    where.textContent = 'صفحة ' + pageNo + ' من ' + pages;

    if (!shown.length) {
      list.innerHTML = '<p class="empty">' + (filter === 'saved' && !q
        ? 'قائمتك فاضية. اضغط على القلب جنب أي دار بدك تزورها.'
        : 'ما في دار نشر بهالاسم أو الرقم.') + '</p>';
      return;
    }

    // Hall headings count the whole result, not just this page.
    var totals = {};
    shown.forEach(function (item) { var h = item.hall || '—'; totals[h] = (totals[h] || 0) + 1; });

    var groups = {}, order = [];
    shown.slice((pageNo - 1) * PER_PAGE, pageNo * PER_PAGE).forEach(function (item) {
      var h = item.hall || '—';
      if (!groups[h]) { groups[h] = []; order.push(h); }
      groups[h].push(item);
    });
    list.innerHTML = order.map(function (h) {
      var title = h === '—' ? 'بدون جناح' : 'أجنحة ' + h;
      return '<section class="hall"><h2>' + title + ' <span>' + totals[h] + '</span></h2>' +
        '<div class="cards">' + groups[h].map(card).join('') + '</div></section>';
    }).join('');
  }

  input.addEventListener('input', render);

  // Turn the page and bring the top of the list back under the search bar.
  function turn(step) {
    pageNo += step;
    render(true);
    var bar = document.querySelector('.bar');
    var top = list.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 8;
    window.scrollTo(0, Math.max(0, top));
  }
  prev.addEventListener('click', function () { turn(-1); });
  next.addEventListener('click', function () { turn(1); });

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    filter = b.dataset.f;
    tabs.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-pressed', String(t === b)); });
    render();
  });

  list.addEventListener('click', function (e) {
    var b = e.target.closest('.heart');
    if (!b) return;
    var item = items[Number(b.dataset.id)];
    if (saved[item.name]) delete saved[item.name]; else saved[item.name] = true;
    persist();

    // In "قائمتي" an un-hearted card should leave; everywhere else just
    // flip the one heart so the page doesn't move.
    if (filter === 'saved') return render(true);
    var on = !!saved[item.name];
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'شيل من قائمتي' : 'ضيف لقائمتي');
    updateSavedTab();
  });

  render();

  // Keeps a copy on the phone so the page opens at the fair with no
  // signal. See publishers-sw.js at the site root.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/publishers-sw.js', { scope: '/publishers' }).catch(function () {});
    });
  }
})();
