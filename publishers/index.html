  :root {
    --ground: #F5F5F4;
    --card: #FFFFFF;
    --ink: #201F1D;
    --muted: #666560;
    --faint: #8C8B85;
    --edge: #E2E0DA;
    --forest: #0F3A2B;
    --green: #167B54;
    --gold: #C79A3E;
    --heart: #D9694A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Cairo', system-ui, sans-serif;
    min-height: 100%;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 36px 16px 64px; }

  h1 {
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: clamp(30px, 9vw, 40px);
    color: var(--forest);
    margin: 0 0 6px;
    line-height: 1.3;
    text-align: center;
  }
  .lede { margin: 0 0 18px; font-size: 15px; line-height: 1.8; color: var(--muted); text-align: center; }
  .maplink { display: flex; justify-content: center; margin: -4px 0 18px; }
  .maplink a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 12px;
    background: var(--gold);
    color: var(--forest);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
  }
  .maplink a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .maplink svg { width: 19px; height: 19px; }

  /* Search and filters stay on screen while the list scrolls. */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--ground);
    padding: 10px 0 8px;
    margin: 0 -2px;
    padding-inline: 2px;
    border-bottom: 1px solid var(--edge);
  }

  .search { position: relative; display: block; }
  .search input {
    width: 100%;
    height: 50px;
    padding: 0 44px 0 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 12px;
  }
  .search input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .search svg {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 19px;
    height: 19px;
    color: var(--faint);
    pointer-events: none;
  }

  .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tab {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: var(--ground); }
  .tab:focus-visible, .heart:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .count { font-size: 12px; color: var(--faint); margin: 10px 2px 0; }
  .empty { text-align: center; color: var(--muted); font-size: 15px; line-height: 1.8; padding: 40px 10px; }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .pager[hidden] { display: none; }
  .pager button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    min-height: 44px;
    min-width: 96px;
    padding: 0 16px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: var(--forest);
    cursor: pointer;
  }
  .pager button[disabled] { background: var(--edge); color: var(--faint); cursor: default; }
  .pager button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .pager .where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .hall { margin-top: 18px; }
  .hall h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 14px;
    color: var(--forest);
    font-weight: 700;
  }
  .hall h2 span { color: var(--faint); font-weight: 600; font-size: 12px; }
  .hall h2::after { content: ''; flex: 1; height: 1px; background: var(--edge); align-self: center; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 10px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 108px;
  }
  .card .name { font-size: 14px; font-weight: 700; line-height: 1.55; flex: 1; word-break: break-word; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; }
  .booth {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin: -6px -6px;
    padding: 6px 6px;
    border: none;
    border-radius: 8px;
    background: none;
    font-family: inherit;
    color: var(--green);
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .booth small { color: var(--faint); font-weight: 600; font-size: 12px; }

  /* A reader's own note on a hearted publisher, shown in قائمتي. 16px so
     iPhones don't zoom the page when it's tapped. */
  .note {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 6px 8px;
    border: 1px dashed var(--edge);
    border-radius: 8px;
    background: var(--ground);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    resize: none;
    overflow: hidden;
  }
  .note::placeholder { color: var(--faint); font-size: 13px; }
  .note:focus { outline: 2px solid var(--green); outline-offset: 1px; border-style: solid; background: var(--card); }

  /* ✓ and ✕ appear only while the note differs from what's saved. */
  .noteacts { display: none; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .notebox.dirty .noteacts { display: flex; }
  .noteacts button {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .noteacts svg { width: 18px; height: 18px; }
  .notesave { border: none; background: var(--green); color: #FFFFFF; }
  .notecancel { border: 1px solid var(--edge); background: var(--card); color: var(--muted); }
  .noteacts button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .booth svg { width: 13px; height: 13px; }
  .booth:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .card .where { display: flex; align-items: center; gap: 7px; }
  .flag { font-size: 18px; line-height: 1; }
  .flag svg { display: block; width: 21px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 0.5px rgba(0,0,0,.25); }

  .heart {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    margin: -8px -10px -8px -8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 50%;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  .heart svg { width: 21px; height: 21px; transition: transform .15s ease; }
  .heart[aria-pressed="true"] { color: var(--heart); }
  .heart[aria-pressed="true"] svg { fill: currentColor; }
  .heart:active svg { transform: scale(0.85); }

  mark { background: rgba(199,154,62,.3); color: inherit; border-radius: 3px; }

  /* The map: a full-screen layer over the list with its own pinch, drag
     and zoom, so the page underneath never moves. */
  @property --inv { syntax: '<number>'; inherits: true; initial-value: 1; }
  body.mapopen { overflow: hidden; }
  .mapview { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--ground); }
  .mapview[hidden] { display: none; }
  .maptop {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
    background: var(--forest);
  }
  .maptop h2 {
    flex: 1;
    margin: 0;
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: 23px;
    font-weight: 700;
    color: var(--ground);
  }
  .mapclose {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: var(--ground);
    cursor: pointer;
  }
  .mapclose svg { width: 20px; height: 20px; }
  .mapmine {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    background: transparent;
    color: var(--ground);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .mapmine[hidden] { display: none; }
  .mapmine svg { width: 16px; height: 16px; }
  .mapmine[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--forest); }
  .mapmine[aria-pressed="true"] svg { fill: currentColor; }
  .mapclose:focus-visible, .mapmine:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .mapstage { flex: 1; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #FFFFFF; cursor: grab; }
  .mapcanvas { position: absolute; left: 0; top: 0; width: 1780px; height: 2210px; transform-origin: 0 0; }
  .mapcanvas.glide { transition: transform .55s cubic-bezier(.2,.8,.2,1), --inv .55s cubic-bezier(.2,.8,.2,1); }
  .mapcanvas img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-select: none; }

  /* Pins stand on their point and keep the same size on screen whatever
     the zoom: --inv is 1 / the map's scale. */
  .pin {
    position: absolute;
    width: 34px;
    height: 44px;
    margin: -44px 0 0 -17px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    transform: scale(var(--inv));
    transform-origin: 50% 100%;
  }
  .pin .bob { position: absolute; inset: 0; }
  .pin .drop { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .pin.mine .drop { fill: var(--heart); stroke: #FFFFFF; stroke-width: 2; }
  .pin.mine .inside { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: #FFFFFF; fill: #FFFFFF; }
  .pin.focus { z-index: 1; width: 46px; height: 60px; margin: -60px 0 0 -23px; }
  .pin.focus .drop { fill: var(--gold); stroke: var(--forest); stroke-width: 1.6; }
  .pin.focus b {
    position: absolute;
    left: 0;
    right: 0;
    top: 15px;
    text-align: center;
    font-size: 12px;
    line-height: 1;
    color: var(--forest);
  }
  .pin.focus::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 48px;
    height: 48px;
    margin: 0 0 -24px -24px;
    border: 3px solid var(--gold);
    border-radius: 50%;
    animation: ring 1.6s ease-out infinite;
  }
  .pin.focus .bob { animation: land .6s cubic-bezier(.3,1.6,.5,1) .4s both; }
  @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes land { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .mapcanvas.glide { transition: none; }
    .pin.focus::before, .pin.focus .bob { animation: none; }
  }

  .mapnote {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--card);
    border-top: 1px solid var(--edge);
    font-size: 14px;
    line-height: 1.6;
  }
  .mapnote .code {
    flex: none;
    padding: 4px 10px;
    border-radius: 10px;
    background: var(--gold);
    color: var(--forest);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .mapnote .names { font-weight: 700; }
  .mapnote .hint { width: 100%; text-align: center; color: var(--muted); }

  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--faint); line-height: 1.9; }
  footer a { color: var(--ink); }
  footer .privacy { margin: 14px auto 0; max-width: 380px; font-size: 11px; line-height: 1.8; }
  footer .powered { margin-top: 10px; font-size: 12px; color: var(--muted); }
  footer .powered b { color: var(--green); }

  <h1>دليل الناشرين</h1>
  <p class="lede">دوّر على دار النشر، وحط قلب على اللي بدك تزورها</p>
  <p class="maplink">
    <a href="/publishers/map.webp" id="mapLink">

  </p>

    C21: [380, 550], C22: [356, 504], C23: [466, 682], C24: [462, 618],
    C25: [462, 544], C26: [512, 682], C27: [508, 618], C28: [508, 544],
    C29: [460, 508], C30: [594, 690], C31: [594, 614], C32: [594, 550],
    C33: [642, 678], C34: [642, 570], C35: [614, 510], C36: [742, 680],
    C37: [742, 590], C38: [742, 528], C39: [786, 680], C40: [786, 590],
    C41: [786, 528], C42: [870, 682], C43: [870, 576], C44: [914, 682],
    C45: [914, 576], C46: [890, 520]
  };
  var MAP_W = 1780, MAP_H = 2210;

  // Flags the phone's emoji can't be trusted to draw right. Many phones
  // still show Syria's old flag for 🇸🇾, so the current one (green, white
  // and black with three red stars) is drawn here instead.
  var DRAWN_FLAGS = {
    SY: '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#FFFFFF"/><rect width="30" height="6.67" fill="#007A3D"/><rect y="13.33" width="30" height="6.67" fill="#000000"/><polygon fill="#CE1126" points="7.50,7.40 8.08,9.20 9.97,9.20 8.44,10.31 9.03,12.10 7.50,10.99 5.97,12.10 6.56,10.31 5.03,9.20 6.92,9.20"/><polygon fill="#CE1126" points="15.00,7.40 15.58,9.20 17.47,9.20 15.94,10.31 16.53,12.10 15.00,10.99 13.47,12.10 14.06,10.31 12.53,9.20 14.42,9.20"/><polygon fill="#CE1126" points="22.50,7.40 23.08,9.20 24.97,9.20 23.44,10.31 24.03,12.10 22.50,10.99 20.97,12.10 21.56,10.31 20.03,9.20 21.92,9.20"/></svg>'
  };

  // "JO" -> 🇯🇴: each letter becomes its regional-indicator symbol, and
  // the phone draws the pair as a flag.
  function flag(code) {
    if (DRAWN_FLAGS[code]) return DRAWN_FLAGS[code];
    return String.fromCodePoint.apply(null, code.split('').map(function (c) {
      return 0x1F1E6 + c.charCodeAt(0) - 65;
    }));
  }

  var SAVED_KEY = 'publishers:saved';
  var NOTES_KEY = 'publishers:notes';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
  var CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>';
  var PIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.8" r="2.2"></circle></svg>';
  var DROP = '<svg class="drop" viewBox="0 0 32 42" aria-hidden="true"><path d="M16 40.5S3 26.3 3 16a13 13 0 0 1 26 0c0 10.3-13 24.5-13 24.5z"></path></svg>';
  var HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.3 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"></path></svg>';

  var input = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var tabs = document.getElementById('tabs');
  var savedTab = document.getElementById('savedTab');

  // Like normalise() in api/word.js, plus ى/ي and tatweel, so "الشروق",
  // "شروق" and "b14" all find what they should.
  function normalise(text) {
    return String(text)
      .toLowerCase()
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var items = PUBLISHERS.map(function (p, i) {
    return {
      id: String(i),
      name: p[0],
      booth: p[1],
      hall: p[1] ? p[1][0] : '',
      country: p[2],
      key: normalise(p[0] + ' ' + p[1] + ' ' + (COUNTRIES[p[2]] || ''))
    };
  });

  // Hearts are stored by name, so they survive the list being reordered.
  var saved = {};
  try {
    (JSON.parse(localStorage.getItem(SAVED_KEY)) || []).forEach(function (name) { saved[name] = true; });
  } catch (e) {}

  // Notes are kept by name too, and survive un-hearting, so an
  // accidental tap on the heart doesn't lose what was written.
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch (e) {}

  function persistNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
    catch (e) { /* private mode: notes last until the page closes */ }
  }

  function persist() {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(Object.keys(saved))); }
    catch (e) { /* private mode: hearts last until the page closes */ }
  }

  var filter = 'all';
  var PER_PAGE = 24;   // twelve rows of two cards
  var pageNo = 1;

  var pager = document.getElementById('pager');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var where = document.getElementById('where');

  // Marks the typed text inside a name, when it appears there as typed.
  function highlight(name) {
    var typed = input.value.trim();
    var at = typed ? name.toLowerCase().indexOf(typed.toLowerCase()) : -1;
    if (at < 0) return esc(name);
    return esc(name.slice(0, at)) + '<mark>' + esc(name.slice(at, at + typed.length)) + '</mark>' +
      esc(name.slice(at + typed.length));
  }

  function heartButton(item) {
    var on = !!saved[item.name];
    return '<button type="button" class="heart" data-id="' + item.id + '" aria-pressed="' + on + '" aria-label="' +
      (on ? 'شيل من قائمتي' : 'ضيف لقائمتي') + '">' + HEART + '</button>';
  }

  function card(item) {
    var place = COUNTRIES[item.country] || '';
    var flagMark = place
      ? '<span class="flag" role="img" aria-label="' + place + '" title="' + place + '">' + flag(item.country) + '</span>'
      : '';
    var booth = item.booth
      ? '<button type="button" class="booth" data-booth="' + esc(item.booth) + '" aria-label="جناح ' + esc(item.booth) +
        '، على الخريطة"><small>جناح </small><span dir="ltr">' + esc(item.booth) + '</span>' + PIN_ICON + '</button>'
      : '';
    booth = '<span class="where">' + flagMark + booth + '</span>';
    var note = filter === 'saved'
      ? '<div class="notebox" data-id="' + item.id + '">' +
        '<textarea class="note" rows="1" maxlength="300" placeholder="اكتب ملاحظة شخصية (تظهر لك فقط)" aria-label="ملاحظة على ' +
        esc(item.name) + '">' + esc(notes[item.name] || '') + '</textarea>' +
        '<div class="noteacts">' +
        '<button type="button" class="notecancel" aria-label="تجاهل التعديل">' + CROSS + '</button>' +
        '<button type="button" class="notesave" aria-label="احفظ الملاحظة">' + CHECK + '</button>' +
        '</div></div>'
      : '';
    return '<div class="card"><div class="name">' + highlight(item.name) + '</div>' + note +
      '<div class="foot">' + booth + heartButton(item) + '</div></div>';
  }

  function updateSavedTab() {
    var n = Object.keys(saved).length;
    savedTab.textContent = 'قائمتي' + (n ? ' (' + n + ')' : '');
  }

  // A new search or filter starts again at page 1; `keepPage` is for
  // re-drawing the same view (turning a page, un-hearting in قائمتي).
  function render(keepPage) {
    if (keepPage !== true) pageNo = 1;
    var q = normalise(input.value);
    var shown = items.filter(function (item) {
      if (filter === 'saved' && !saved[item.name]) return false;
      if (filter.length === 1 && item.hall !== filter) return false;
      return !q || item.key.indexOf(q) >= 0;
    });

    updateSavedTab();
    count.textContent = shown.length + ' من ' + items.length + ' دار نشر';

    var pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
    pageNo = Math.min(pageNo, pages);
    pager.hidden = pages < 2;
    prev.disabled = pageNo === 1;
    next.disabled = pageNo === pages;
    where.textContent = 'صفحة ' + pageNo + ' من ' + pages;

    if (!shown.length) {
      list.innerHTML = '<p class="empty">' + (filter === 'saved' && !q
        ? 'قائمتك فاضية. اضغط على القلب جنب أي دار بدك تزورها.'
        : 'ما في دار نشر بهالاسم أو الرقم.') + '</p>';
      return;
    }

    // Hall headings count the whole result, not just this page.
    var totals = {};
    shown.forEach(function (item) { var h = item.hall || '—'; totals[h] = (totals[h] || 0) + 1; });

    var groups = {}, order = [];
    shown.slice((pageNo - 1) * PER_PAGE, pageNo * PER_PAGE).forEach(function (item) {
      var h = item.hall || '—';
      if (!groups[h]) { groups[h] = []; order.push(h); }
      groups[h].push(item);
    });
    list.innerHTML = order.map(function (h) {
      var title = h === '—' ? 'بدون جناح' : 'أجنحة ' + h;
      return '<section class="hall"><h2>' + title + ' <span>' + totals[h] + '</span></h2>' +
        '<div class="cards">' + groups[h].map(card).join('') + '</div></section>';
    }).join('');
    list.querySelectorAll('.note').forEach(grow);
  }

  input.addEventListener('input', render);

  function grow(box) {
    box.style.height = 'auto';
    box.style.height = box.scrollHeight + 2 + 'px';
  }

  // A note is only saved with ✓; ✕ puts back what was saved.
  function noteParts(el) {
    var wrap = el.closest('.notebox');
    return wrap && { wrap: wrap, box: wrap.querySelector('.note'), name: items[Number(wrap.dataset.id)].name };
  }

  list.addEventListener('input', function (e) {
    var n = e.target.classList.contains('note') && noteParts(e.target);
    if (!n) return;
    n.wrap.classList.toggle('dirty', n.box.value.trim() !== (notes[n.name] || '').trim());
    grow(n.box);
  });

  // Turn the page and bring the top of the list back under the search bar.
  function turn(step) {
    pageNo += step;
    render(true);
    var bar = document.querySelector('.bar');
    var top = list.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - 8;
    window.scrollTo(0, Math.max(0, top));
  }
  prev.addEventListener('click', function () { turn(-1); });
  next.addEventListener('click', function () { turn(1); });

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    filter = b.dataset.f;
    tabs.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-pressed', String(t === b)); });
    render();
  });

  list.addEventListener('click', function (e) {
    var act = e.target.closest('.notesave, .notecancel');
    if (act) {
      var n = noteParts(act);
      if (act.classList.contains('notesave')) {
        if (n.box.value.trim()) notes[n.name] = n.box.value.trim(); else delete notes[n.name];
        persistNotes();
      }
      n.box.value = notes[n.name] || '';
      n.wrap.classList.remove('dirty');
      grow(n.box);
      return;
    }
    var spot = e.target.closest('.booth');
    if (spot) return openMap(spot.dataset.booth);
    var b = e.target.closest('.heart');
    if (!b) return;
    var item = items[Number(b.dataset.id)];
    if (saved[item.name]) delete saved[item.name]; else saved[item.name] = true;
    persist();

    // In "قائمتي" an un-hearted card should leave; everywhere else just
    // flip the one heart so the page doesn't move.
    if (filter === 'saved') return render(true);
    var on = !!saved[item.name];
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'شيل من قائمتي' : 'ضيف لقائمتي');
    updateSavedTab();
  });

  // ---- The map ----
  // Opened plain from the button, or from a card's booth with a gold pin
  // on it. Hearted publishers get pins too, toggled by "قائمتي".
  var mapview = document.getElementById('mapview');
  var stage = document.getElementById('mapStage');
  var canvas = document.getElementById('mapCanvas');
  var pins = document.getElementById('mapPins');
  var note = document.getElementById('mapNote');
  var mineBtn = document.getElementById('mapMine');
  var closeBtn = document.getElementById('mapClose');
  var MAX_SCALE = 2;
  var z = { s: 1, x: 0, y: 0 };
  var focusBooth = null, showMine = true, opener = null;

  function fitScale() { return Math.min(stage.clientWidth / MAP_W, stage.clientHeight / MAP_H); }

  // Keep the map on screen: centred when smaller than the screen,
  // edge-to-edge when bigger.
  function paint(glide) {
    var W = stage.clientWidth, H = stage.clientHeight;
    z.s = Math.min(Math.max(z.s, fitScale()), MAX_SCALE);
    var w = MAP_W * z.s, h = MAP_H * z.s;
    z.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, z.x));
    z.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, z.y));
    canvas.classList.toggle('glide', !!glide);
    canvas.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')';
    canvas.style.setProperty('--inv', 1 / z.s);
  }

  // Zoom to `s`, keeping the map point under (px, py) where it is.
  function zoomAt(px, py, s) {
    s = Math.min(Math.max(s, fitScale()), MAX_SCALE);
    z.x = px - (px - z.x) * s / z.s;
    z.y = py - (py - z.y) * s / z.s;
    z.s = s;
  }

  function pinHtml(kind, booth) {
    var p = BOOTHS[booth];
    var inside = kind === 'focus'
      ? '<b dir="ltr">' + esc(booth) + '</b>'
      : HEART.replace('<svg ', '<svg class="inside" ');
    return '<button type="button" class="pin ' + kind + '" data-booth="' + esc(booth) + '" style="left:' + p[0] +
      'px;top:' + p[1] + 'px" aria-label="جناح ' + esc(booth) + '"><span class="bob">' + DROP + inside + '</span></button>';
  }

  function drawPins() {
    var mine = items.filter(function (item) { return saved[item.name] && BOOTHS[item.booth]; });
    mineBtn.hidden = !mine.length;
    mineBtn.setAttribute('aria-pressed', String(showMine));
    mineBtn.innerHTML = HEART + 'قائمتي (' + mine.length + ')';

    var html = '';
    if (showMine) {
      mine.forEach(function (item) { if (item.booth !== focusBooth) html += pinHtml('mine', item.booth); });
    }
    if (focusBooth && BOOTHS[focusBooth]) html += pinHtml('focus', focusBooth);
    pins.innerHTML = html;
  }

  function showNote(booth) {
    var here = booth ? items.filter(function (item) { return item.booth === booth; }) : [];
    note.innerHTML = here.length
      ? '<span class="code" dir="ltr">' + esc(booth) + '</span><span class="names">' +
        here.map(function (item) { return esc(item.name); }).join('<br>') + '</span>'
      : '<span class="hint">قرّب بإصبعين، أو اضغط مرتين على المكان</span>';
  }

  function openMap(booth) {
    opener = document.activeElement;
    focusBooth = BOOTHS[booth] ? booth : null;
    mapview.hidden = false;
    document.body.classList.add('mapopen');
    if (!(history.state && history.state.map)) history.pushState({ map: true }, '');
    drawPins();
    showNote(focusBooth);

    // Start from the whole map, then glide in to the booth.
    z.s = 0;
    paint(false);
    if (focusBooth) {
      void canvas.offsetWidth;
      var p = BOOTHS[focusBooth];
      var s = Math.min(MAX_SCALE, Math.max(fitScale() * 3, 0.7));
      z.x = stage.clientWidth / 2 - p[0] * s;
      z.y = stage.clientHeight / 2 - p[1] * s;
      z.s = s;
      paint(true);
    }
    closeBtn.focus();
  }

  function hideMap() {
    mapview.hidden = true;
    document.body.classList.remove('mapopen');
    if (opener && opener.focus) opener.focus();
  }

  // The phone's back button closes the map rather than leaving the page.
  function closeMap() {
    if (history.state && history.state.map) history.back(); else hideMap();
  }
  window.addEventListener('popstate', function () {
    if (!mapview.hidden && !(history.state && history.state.map)) hideMap();
  });
  if (history.state && history.state.map) history.replaceState(null, '');

  document.getElementById('mapLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMap(null);
  });
  closeBtn.addEventListener('click', closeMap);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !mapview.hidden) closeMap();
  });
  mineBtn.addEventListener('click', function () {
    showMine = !showMine;
    drawPins();
  });
  window.addEventListener('resize', function () { if (!mapview.hidden) paint(false); });

  // Drag with one finger, pinch with two, double-tap to zoom in (or back
  // out). Pointers are followed on window so a tap on a pin still clicks.
  var fingers = {}, moved = false, downAt = null, lastTap = 0;

  function centre() {
    var ids = Object.keys(fingers), x = 0, y = 0;
    ids.forEach(function (id) { x += fingers[id].x; y += fingers[id].y; });
    x /= ids.length; y /= ids.length;
    var d = ids.length > 1
      ? Math.hypot(fingers[ids[0]].x - fingers[ids[1]].x, fingers[ids[0]].y - fingers[ids[1]].y)
      : 0;
    return { x: x, y: y, d: d };
  }

  stage.addEventListener('pointerdown', function (e) {
    if (!Object.keys(fingers).length) {
      moved = false;
      downAt = { x: e.clientX, y: e.clientY };
    }
    fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', function (e) {
    if (!fingers[e.pointerId]) return;
    var a = centre();
    fingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var b = centre();
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8 || b.d) moved = true;
    if (!moved) return;
    var r = stage.getBoundingClientRect();
    z.x += b.x - a.x;
    z.y += b.y - a.y;
    if (a.d && b.d) zoomAt(b.x - r.left, b.y - r.top, z.s * b.d / a.d);
    paint(false);
  });

  function lift(e) {
    if (!fingers[e.pointerId]) return;
    delete fingers[e.pointerId];
    if (e.type !== 'pointerup' || moved || Object.keys(fingers).length) return;
    var now = Date.now();
    if (now - lastTap < 300) {
      var r = stage.getBoundingClientRect(), fit = fitScale();
      zoomAt(e.clientX - r.left, e.clientY - r.top,
        z.s > fit * 1.5 ? fit : Math.min(MAX_SCALE, Math.max(fit * 3, 0.7)));
      paint(true);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
  window.addEventListener('pointerup', lift);
  window.addEventListener('pointercancel', lift);

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, z.s * Math.exp(-e.deltaY * 0.0015));
    paint(false);
  }, { passive: false });

  pins.addEventListener('click', function (e) {
    var pin = e.target.closest('.pin');
    if (pin && !moved) showNote(pin.dataset.booth);
  });

  render();

  // Keeps a copy on the phone so the page opens at the fair with no
  // signal. See publishers-sw.js at the site root.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/publishers-sw.js', { scope: '/publishers' }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
