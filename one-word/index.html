<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كلمة واحدة — The Techy Reader</title>
<meta name="description" content="اكتب اسم أي كتاب، وبرجعلك كلمة وحدة بتعبر عنه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #F5F5F4;
    --card: #FFFFFF;
    --ink: #201F1D;
    --muted: #666560;
    --faint: #8C8B85;
    --edge: #DAD8D2;
    --forest: #0F3A2B;
    --green: #167B54;
    --gold: #C79A3E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Cairo', system-ui, sans-serif;
    min-height: 100%;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 22px 64px; }

  h1 {
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: clamp(30px, 9vw, 40px);
    color: var(--forest);
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .lede { margin: 0 0 30px; font-size: 15px; line-height: 1.8; color: var(--muted); }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  input[type="text"] {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 12px;
  }
  input[type="text"]:focus { outline: 2px solid var(--green); outline-offset: 1px; }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    min-height: 54px;
  }
  .lang {
    display: block;
    margin: -16px 0 18px;
    margin-inline-start: auto;
    min-height: 34px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--edge);
    border-radius: 999px;
  }
  .primary { width: 100%; margin-top: 14px; color: var(--forest); background: var(--gold); }
  .primary[disabled] { opacity: 0.6; cursor: default; }
  .ghost {
    width: 100%;
    margin-top: 10px;
    min-height: 46px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ground);
    background: transparent;
    border: 1px solid rgba(245,245,244,0.55);
  }
  .light { width: 100%; min-height: 46px; font-size: 15px; color: var(--forest); background: var(--gold); }

  .result {
    margin-top: 34px;
    padding: 34px 24px 26px;
    border-radius: 18px;
    background: var(--forest);
    color: var(--ground);
    text-align: center;
  }
  .result .title { font-size: 14px; opacity: 0.85; margin-bottom: 26px; }
  .result .word {
    font-family: 'Aref Ruqaa', Georgia, serif;
    font-size: clamp(52px, 17vw, 76px);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 26px;
    word-break: break-word;
  }

  .vote { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .vote button {
    width: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ground);
    background: transparent;
    border: 1px solid rgba(245,245,244,0.55);
    border-radius: 999px;
  }
  .vote button svg { width: 20px; height: 20px; }
  .vote button[disabled] { opacity: 0.45; cursor: default; }
  .voted { font-size: 14px; opacity: 0.9; margin-bottom: 22px; }

  .note { margin-top: 26px; font-size: 14px; line-height: 1.8; color: var(--muted); }


  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--faint); line-height: 1.9; }
  footer a { color: var(--ink); }

  .hidden { display: none; }
  canvas { display: none; }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">

  <button id="lang" class="lang" type="button" lang="en">English</button>

  <h1 data-t="h1">كلمة واحدة</h1>
  <p class="lede" data-t="lede">اكتب اسم أي كتاب، وبرجعلك كلمة وحدة بتعبر عنه</p>

  <label for="title" data-t="label">اسم الكتاب</label>
  <input id="title" type="text" dir="auto" autocomplete="off">
  <button id="go" class="primary" type="button">كلمة وحدة بس</button>

  <div id="result" class="result hidden">
    <div class="title" id="rTitle" dir="auto"></div>
    <div class="word" id="rWord" dir="auto"></div>

    <div class="vote" id="voteBox">
      <button id="up" type="button" aria-label="الكلمة مظبوطة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3z"></path>
          <path d="M7 10l4.2-7.4a1 1 0 0 1 1.8.2l.3 1a4 4 0 0 1-.3 3.1L12 9h5.7a2.4 2.4 0 0 1 2.3 3l-1.7 7a2.4 2.4 0 0 1-2.3 2H7"></path>
        </svg>
      </button>
      <button id="down" type="button" aria-label="الكلمة مش مظبوطة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 14V3H4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3z"></path>
          <path d="M7 14l4.2 7.4a1 1 0 0 0 1.8-.2l.3-1a4 4 0 0 0-.3-3.1L12 15h5.7a2.4 2.4 0 0 0 2.3-3l-1.7-7A2.4 2.4 0 0 0 16 3H7"></path>
        </svg>
      </button>
    </div>
    <div class="voted hidden" id="voted" data-t="voted">شكراً — بتساعدني أحسّنها.</div>

    <button id="save" class="light" type="button" data-t="save">احفظ الصورة</button>
    <button id="again" class="ghost" type="button" data-t="again">كتاب ثاني</button>
  </div>

  <p id="note" class="note hidden"></p>

  <footer>
    <span data-t="tagline">كلمة واحدة لكل كتاب</span><br>
    <a href="https://instagram.com/reemiii_93" dir="ltr">@reemiii_93</a>
  </footer>

</div>

<canvas id="card" width="1080" height="1920"></canvas>

<script>
(function () {
  var input = document.getElementById('title');
  var go = document.getElementById('go');
  var result = document.getElementById('result');
  var rTitle = document.getElementById('rTitle');
  var rWord = document.getElementById('rWord');
  var note = document.getElementById('note');
  var up = document.getElementById('up');
  var down = document.getElementById('down');
  var langBtn = document.getElementById('lang');
  var voteBox = document.getElementById('voteBox');
  var votedMsg = document.getElementById('voted');
  var canvas = document.getElementById('card');

  var STRINGS = {
    ar: {
      docTitle: 'كلمة واحدة — The Techy Reader',
      h1: 'كلمة واحدة',
      lede: 'اكتب اسم أي كتاب، وبرجعلك كلمة وحدة بتعبر عنه',
      label: 'اسم الكتاب',
      go: 'كلمة وحدة بس',
      wait: 'لحظة...',
      up: 'الكلمة مظبوطة',
      down: 'الكلمة مش مظبوطة',
      voted: 'شكراً — بتساعدني أحسّنها.',
      save: 'احفظ الصورة',
      again: 'كتاب ثاني',
      limit: 'خلص رصيدك لهالساعة. جرّب بعد شوي.',
      broken: 'في مشكلة من عندي، مش منك. جرّب كمان شوي.',
      unknown: 'ما بعرف هالكتاب لسا. ابعتلي اسمه ع الإنستغرام وبضيفه.',
      offline: 'في مشكلة بالاتصال. جرّب كمان مرة.',
      tagline: 'كلمة واحدة لكل كتاب'
    },
    en: {
      docTitle: 'One Word — The Techy Reader',
      h1: 'One Word',
      lede: "Type any book title, and I'll give you one word that captures it.",
      label: 'Book title',
      go: 'Just one word',
      wait: 'One moment...',
      up: 'The word fits',
      down: "The word doesn't fit",
      voted: 'Thanks — this helps me make it better.',
      save: 'Save image',
      again: 'Another book',
      limit: "You've used up your lookups for this hour. Try again in a bit.",
      broken: "Something's wrong on my side, not yours. Try again in a bit.",
      unknown: "I don't know this book yet. Send me its title on Instagram and I'll add it.",
      offline: 'Connection problem. Try again.',
      tagline: 'One word for every book'
    }
  };

  var LANG_KEY = 'oneword:lang';
  var lang = 'ar';
  try { if (localStorage.getItem(LANG_KEY) === 'en') lang = 'en'; } catch (e) {}
  var noteKey = null;

  function t(key) { return STRINGS[lang][key]; }

  function applyLang() {
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('docTitle');

    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-t'));
    });
    up.setAttribute('aria-label', t('up'));
    down.setAttribute('aria-label', t('down'));
    go.textContent = go.disabled ? t('wait') : t('go');
    if (noteKey) note.textContent = t(noteKey);

    // The toggle names the language it switches to, in that language.
    langBtn.textContent = lang === 'ar' ? 'English' : 'عربي';
    langBtn.lang = lang === 'ar' ? 'en' : 'ar';
  }

  langBtn.addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  });

  applyLang();

  // Books already asked on this device: [{ key, title, word }], oldest
  // first. Keyed by the normalised title so "Piranesi" and "piranesi "
  // are one entry, and answered without a network request.
  var LOCAL = 'oneword:v2';
  var OLD = 'oneword:v1';
  var store = load();

  // Same rules as normalise() in api/word.js. Keep the two in step.
  function normalise(title) {
    return title
      .trim()
      .toLowerCase()
      .replace(/[\u064B-\u0652]/g, '')
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ');
  }

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(LOCAL));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}

    // First visit since v2: carry over the old { title: word } history,
    // merging titles that only differed in case or spacing.
    store = [];
    try {
      var old = JSON.parse(localStorage.getItem(OLD)) || {};
      Object.keys(old).forEach(function (title) { remember(title.trim(), old[title]); });
      save();
      localStorage.removeItem(OLD);
    } catch (e) {}
    return store;
  }

  function find(key) {
    for (var i = 0; i < store.length; i++) {
      if (store[i].key === key) return store[i];
    }
    return null;
  }

  // Adds or refreshes an entry and moves it to the end (most recent).
  function remember(title, word) {
    var key = normalise(title);
    store = store.filter(function (entry) { return entry.key !== key; });
    store.push({ key: key, title: title, word: word });
  }

  function save() {
    try { localStorage.setItem(LOCAL, JSON.stringify(store)); }
    catch (e) { /* private mode — the page still works, it just forgets */ }
  }

  function show(title, word) {
    rTitle.textContent = title;
    rWord.textContent = word;
    result.classList.remove('hidden');
    note.classList.add('hidden');
    noteKey = null;

    // A fresh result is votable again.
    voteBox.classList.remove('hidden');
    votedMsg.classList.add('hidden');
    up.disabled = false;
    down.disabled = false;
  }

  function say(key) {
    noteKey = key;
    note.textContent = t(key);
    note.classList.remove('hidden');
    result.classList.add('hidden');
  }

  async function lookup() {
    var title = input.value.trim();
    if (!title) { input.focus(); return; }

    // Already asked on this device: never hits the network.
    var saved = find(normalise(title));
    if (saved) {
      remember(title, saved.word);
      save();
      show(title, saved.word);
      return;
    }

    go.disabled = true;
    go.textContent = t('wait');

    try {
      var res = await fetch('/api/word', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: title })
      });

      if (res.status === 429) {
        say('limit');
        return;
      }

      // Our side failed (API down, timeout, rejected origin). Not the
      // reader's fault, and not a verdict on the book.
      if (!res.ok) {
        say('broken');
        return;
      }

      var data = await res.json();

      if (!data.word) {
        say('unknown');
        return;
      }

      remember(title, data.word);
      save();
      show(title, data.word);
    } catch (e) {
      say('offline');
    } finally {
      go.disabled = false;
      go.textContent = t('go');
    }
  }

  async function vote(value) {
    up.disabled = true;
    down.disabled = true;
    voteBox.classList.add('hidden');
    votedMsg.classList.remove('hidden');

    try {
      await fetch('/api/vote', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          title: rTitle.textContent,
          word: rWord.textContent,
          vote: value
        })
      });
    } catch (e) {
      // A lost vote is not worth interrupting anyone over.
    }
  }

  go.addEventListener('click', lookup);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') lookup();
  });

  up.addEventListener('click', function () { vote(1); });
  down.addEventListener('click', function () { vote(-1); });

  document.getElementById('again').addEventListener('click', function () {
    input.value = '';
    result.classList.add('hidden');
    input.focus();
  });

  document.getElementById('save').addEventListener('click', async function () {
    var ctx = canvas.getContext('2d');
    try { await document.fonts.ready; } catch (e) {}

    ctx.fillStyle = '#F5F5F4';
    ctx.fillRect(0, 0, 1080, 1920);
    ctx.textAlign = 'center';
    ctx.direction = document.documentElement.dir;

    ctx.fillStyle = '#666560';
    ctx.font = '40px Cairo, sans-serif';
    ctx.fillText(rTitle.textContent, 540, 760, 900);

    ctx.fillStyle = '#C79A3E';
    ctx.fillRect(516, 830, 48, 4);

    ctx.fillStyle = '#0F3A2B';
    ctx.font = '700 190px "Aref Ruqaa", serif';
    ctx.fillText(rWord.textContent, 540, 1040, 940);

    ctx.fillStyle = '#8C8B85';
    ctx.font = '34px Cairo, sans-serif';
    ctx.fillText(t('tagline'), 540, 1320);
    ctx.fillStyle = '#201F1D';
    ctx.font = '600 36px Cairo, sans-serif';
    ctx.fillText('@reemiii_93', 540, 1380);

    var link = document.createElement('a');
    link.download = 'one-word.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
})();
</script>
</body>
</html>
