  :root {
    --paper: #F6EFE6;
    --card: #FFFDF7;
    --ink: #2E2A26;
    --ink-soft: #4A403A;
    --rose: #E8C3C3;
    --rose-deep: #8E4A51;
    --blue: #A9C3D6;
    --sage: #B7C4A4;
    --blush: #F1E3E0;
    --desk: #EAE0D2;
    --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
    --wobble-2: 15px 225px 15px 255px / 255px 15px 225px 15px;
    --shadow: 0 1px 1px rgba(46,42,38,.08), 0 12px 24px -14px rgba(46,42,38,.45);
    --hand: 'Caveat', 'Aref Ruqaa', cursive;
    --body: 'Lora', 'Amiri', Georgia, serif;
  }
  html:lang(ar) {
    --hand: 'Aref Ruqaa', 'Caveat', serif;
    --body: 'Amiri', 'Lora', serif;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    margin: 0;
    background-color: var(--desk);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.075rem;
    line-height: 1.7;
  }
  html:lang(ar) body { font-size: 1.2rem; line-height: 1.9; }

  /* The site is a page torn from a notebook, lying on two more on the desk:
     aged paper, ruled lines, a red margin, holes along the top and torn
     edges. The shadow sits on the pile so the torn edges cast it too. */
  .pile {
    --margin-x: 46px;
    --margin: linear-gradient(to right, transparent 0 var(--margin-x), rgba(206,92,98,.5) var(--margin-x) calc(var(--margin-x) + 2px), transparent 0);
    position: relative;
    max-width: 1180px;
    margin: 32px auto 48px;
    filter: drop-shadow(0 1px 1px rgba(46,42,38,.16)) drop-shadow(0 10px 14px rgba(46,42,38,.12));
  }
  html[dir="rtl"] .pile {
    --margin: linear-gradient(to left, transparent 0 var(--margin-x), rgba(206,92,98,.5) var(--margin-x) calc(var(--margin-x) + 2px), transparent 0);
  }

  }

    lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
  }

<script>
  // The journey as a notebook to page through: the cover first, then one
  // spread per stop, newest first. Picture and date on one page, the words
  // on the other. Arabic opens the other way (the drawings are mirrored).
  (() => {
    const section = document.getElementById('journey');
    const book = section.querySelector('.book');
    const stage = book.querySelector('.book-stage');
    const prevBtn = book.querySelector('.book-prev');
    const nextBtn = book.querySelector('.book-next');
    const years = book.querySelector('.book-years');
    const pic = stage.querySelector('.page-picture');
    const txt = stage.querySelector('.page-text');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let stops = [], current = 0;

    const ar = () => document.documentElement.lang === 'ar';
    const num = (n) => n.toLocaleString(ar() ? 'ar-EG' : 'en-US');

    function fillPicture(el, i) {
      el.querySelector('.page-when').textContent = stops[i].when;
      el.querySelector('img').src = `/assets/portfolio/icon-${KINDS[i]}.webp`;
    }

    function fillText(el, i) {
      for (const [sel, key] of [['.page-when', 'when'], ['h3', 'title'], ['.page-place', 'place'], ['p', 'line']]) {
        const part = el.querySelector(sel);
        part.textContent = stops[i][key] || '';
        part.hidden = !stops[i][key];
      }
      el.querySelector('.page-num').textContent = `${num(i + 1)} / ${num(stops.length)}`;
    }

    function fill() {
      if (!current) return;
      fillPicture(pic, current - 1);
      fillText(txt, current - 1);
    }

    // A face of the turning leaf: the half of the drawing starting at
    // `start` (% of the width), with a copy of a page filled for stop i.
    const art = stage.querySelector('.art-open');
    function face(page, i, side, start) {
      const el = document.createElement('div');
      el.className = `face face-${side}`;
      const copy = document.createElement('div');
      copy.className = 'copy';
      copy.style.insetInlineStart = `${-start}cqw`;
      const words = page.cloneNode(true);
      (page === pic ? fillPicture : fillText)(words, i);
      copy.append(art.cloneNode(), words);
      el.append(copy);
      return el;
    }

    // Forward, the page with the words lifts and lands on the picture page,
    // its back showing the next picture; backward, the other way round. The
    // page underneath already shows the stop being turned to.
    let leaf = null, anim = null;
    function settle() {
      if (anim) anim.cancel();
      if (leaf) leaf.remove();
      anim = leaf = null;
    }

    function flip(from, to) {
      const forward = to > from;
      const lifted = forward ? txt : pic, under = forward ? pic : txt;
      (lifted === txt ? fillText : fillPicture)(lifted, to - 1);
      leaf = document.createElement('div');
      leaf.className = 'leaf';
      const lift = forward ? 50 : 17.6, land = forward ? 17.6 : 50;
      leaf.style.insetInlineStart = `${lift}%`;
      // The leaf's spine edge is its inline-start side going forward.
      const spineLeft = forward !== ar();
      leaf.style.transformOrigin = spineLeft ? 'left center' : 'right center';
      leaf.append(face(lifted, from - 1, 'front', lift), face(under, to - 1, 'back', land));
      const spread = stage.querySelector('.spread');
      spread.style.perspective = `${spread.clientWidth * 2}px`;
      spread.append(leaf);
      const opts = { duration: 750, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' };
      anim = leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: `rotateY(${spineLeft ? -180 : 180}deg)` }], opts);
      // A light shadow as the page stands up.
      leaf.querySelectorAll('.face').forEach((el) => el.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(.94)' }, { filter: 'brightness(1)' }], opts));
      // Keep the leaf down until the page under it shows the new doodle.
      const mine = leaf;
      anim.onfinish = () => {
        fill();
        pic.querySelector('img').decode().catch(() => {}).then(() => { if (leaf === mine) settle(); });
      };
    }

    function go(n) {
      n = Math.max(0, Math.min(stops.length, n));
      settle();
      const from = current;
      current = n;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === stops.length;
      years.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i + 1 === current)));
      stage.classList.toggle('is-open', current > 0);
      if (from && n && n !== from && !reduce) flip(from, n);
      else fill();
    }

    function load() {
      stops = COPY[document.documentElement.lang].journey;
      years.replaceChildren(...stops.map((stop, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = stop.when;
        b.addEventListener('click', () => go(i + 1));
        return b;
      }));
      go(current);
    }

    // Older stops are further into the book: to the right in English, to
    // the left in Arabic.
    prevBtn.addEventListener('click', () => go(current - 1));
    nextBtn.addEventListener('click', () => go(current + 1));
    book.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      go(current + ((e.key === 'ArrowRight') !== ar() ? 1 : -1));
    });

    let downX = null;
    stage.addEventListener('pointerdown', (e) => { downX = e.clientX; });
    stage.addEventListener('pointercancel', () => { downX = null; });
    stage.addEventListener('pointerup', (e) => {
      if (downX === null) return;
      const dx = e.clientX - downX;
      downX = null;
      if (Math.abs(dx) > 40) go(current + ((dx < 0) !== ar() ? 1 : -1));
      else if (Math.abs(dx) < 8) {
        const r = stage.getBoundingClientRect();
        const narrow = r.width < 640;
        go(current + (current === 0 || narrow || (e.clientX > r.left + r.width / 2) !== ar() ? 1 : -1));
      }
    });

    document.addEventListener('langchange', load);
    load();
    section.classList.add('has-book');
    book.hidden = false;
  })();
</script>
</body>
</html>
