  :root {
    --paper: #F6EFE6;
    --card: #FFFDF7;
    --ink: #2E2A26;
    --ink-soft: #4A403A;
    --rose: #E8C3C3;
    --rose-deep: #8E4A51;
    --blue: #A9C3D6;
    --sage: #B7C4A4;
    --blush: #F1E3E0;
    --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
    --wobble-2: 15px 225px 15px 255px / 255px 15px 225px 15px;
    --shadow: 0 1px 1px rgba(46,42,38,.08), 0 12px 24px -14px rgba(46,42,38,.45);
    --hand: 'Caveat', 'Aref Ruqaa', cursive;
    --body: 'Lora', 'Amiri', Georgia, serif;
  }
  html:lang(ar) {
    --hand: 'Aref Ruqaa', 'Caveat', serif;
    --body: 'Amiri', 'Lora', serif;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(169,195,214,.22) 31px 32px);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.075rem;
    line-height: 1.7;
  }
  html:lang(ar) body { font-size: 1.2rem; line-height: 1.9; }

  .wrap { max-width: 1080px; margin-inline: auto; padding-inline: 20px; }
  section { scroll-margin-block-start: 16px; }

  a { color: var(--rose-deep); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  :focus-visible { outline: 2.5px dashed var(--rose-deep); outline-offset: 4px; border-radius: 6px; }

  h1, h2, h3 { font-family: var(--hand); font-weight: 700; line-height: 1.15; margin: 0; }
  html:lang(ar) :is(h1, h2, h3) { line-height: 1.6; }
  p { margin: 0; }

  .note {
    display: inline-block;
    font-family: var(--hand);
    color: var(--rose-deep);
    font-size: 1.5rem;
    line-height: 1.3;
    transform: rotate(-2deg);
  }
  html:lang(ar) .note { font-size: 1.3rem; }

  /* Nav */
  .nav .wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 28px;
    padding-block: 22px 8px;
  }
  .brand { display: flex; flex-direction: column; align-items: flex-start; color: var(--ink); text-decoration: none; line-height: 1.25; }
  /* The name in the page's own script leads, large; the other script sits under it. */
  .brand-big { font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.3rem; line-height: 1.1; }
  html:lang(ar) .brand-big { font-family: 'Aref Ruqaa', serif; font-size: 2.1rem; line-height: 1.35; }
  .brand-small { font-weight: 700; font-size: 1.05rem; color: var(--ink-soft); }
  html:lang(ar) .brand-small { font-size: .95rem; letter-spacing: .04em; }
  .brand-sub { font-family: var(--hand); color: var(--rose-deep); font-size: 1.4rem; transform: rotate(-2deg); margin-inline-start: 10px; }
  html:lang(ar) .brand-sub { font-size: 1.15rem; }
  .nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; }
  .nav ul a { color: var(--ink); text-decoration: none; font-family: var(--hand); font-size: 1.45rem; }
  html:lang(ar) .nav ul a { font-size: 1.2rem; }
  .nav ul a:hover { text-decoration: underline wavy var(--rose-deep); text-underline-offset: 5px; }
  .lang-toggle {
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: var(--wobble);
    padding: 5px 16px;
    min-height: 40px;
    cursor: pointer;
  }
  .lang-toggle [lang="ar"] { font-family: 'Amiri', serif; font-size: 1.15rem; }
  .lang-toggle .on { font-weight: 700; text-decoration: underline wavy var(--rose-deep); text-underline-offset: 4px; }

  /* Hero */
  .hero { display: grid; gap: 28px; align-items: center; padding-block: 36px 56px; }
  .hero h1 { font-size: clamp(2.7rem, 6.5vw, 4.3rem); margin-block: 10px 18px; }
  html:lang(ar) .hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.5rem); }
  .lede { color: var(--ink-soft); max-width: 34em; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-block-start: 28px; }
  .btn {
    display: inline-block;
    padding: 10px 26px;
    border: 2.5px solid var(--ink);
    border-radius: var(--wobble);
    color: var(--ink);
    text-decoration: none;
    font-family: var(--hand);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
    transition: transform .15s ease;
  }
  html:lang(ar) .btn { font-size: 1.2rem; }
  .btn:hover { transform: rotate(-1.5deg) translateY(-1px); }
  .btn-fill { background: var(--rose); box-shadow: 3px 4px 0 var(--ink); }
  .btn-outline { border-style: dashed; }
  .portrait {
    position: relative;
    max-width: 360px;
    margin: 12px auto 0;
    padding: 12px 12px 16px;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px 14px 8px 12px / 12px 6px 14px 8px;
    box-shadow: var(--shadow);
    transform: rotate(2deg);
  }
  .portrait::before {
    content: '';
    position: absolute;
    inset-block-start: -14px;
    inset-inline-start: calc(50% - 50px);
    width: 100px;
    height: 28px;
    background: rgba(232,195,195,.75);
    box-shadow: 0 1px 2px rgba(46,42,38,.12);
    transform: rotate(-3deg);
  }
  .portrait img { display: block; width: 100%; height: auto; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
  @media (min-width: 860px) {
    .hero { grid-template-columns: 1.1fr .9fr; }
  }

  /* Experience strip */
  .strip {
    list-style: none;
    margin: 0;
    padding: 26px 30px;
    display: grid;
    gap: 20px;
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: var(--wobble-2);
    box-shadow: var(--shadow);
    transform: rotate(-.6deg);
  }
  .strip b { display: block; font-family: var(--hand); font-size: 1.9rem; line-height: 1.25; }
  html:lang(ar) .strip b { font-size: 1.45rem; line-height: 1.7; }
  .strip span { color: var(--ink-soft); }
  @media (min-width: 760px) {
    .strip { grid-template-columns: repeat(3, 1fr); }
    .strip li + li { border-inline-start: 2px dashed rgba(46,42,38,.35); padding-inline-start: 22px; }
  }

  /* Things I've made */
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-block: 72px 36px; }
  .section-head h2 { font-size: clamp(2.3rem, 5vw, 3.1rem); }
  html:lang(ar) .section-head h2 { font-size: clamp(1.9rem, 4.2vw, 2.5rem); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 44px 30px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); align-items: start; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 30px 22px 24px;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: var(--wobble-2);
    box-shadow: var(--shadow);
    transform: rotate(var(--tilt, 0deg));
  }
  .card::before {
    content: '';
    position: absolute;
    inset-block-start: -13px;
    inset-inline-start: calc(50% - 48px);
    width: 96px;
    height: 26px;
    background: var(--tape);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(46,42,38,.12);
    transform: rotate(-4deg);
  }
  .card:nth-child(1) { --tilt: -1.2deg; --tape: rgba(232,195,195,.7); }
  .card:nth-child(2) { --tilt: .9deg; --tape: rgba(169,195,214,.7); }
  .card:nth-child(3) { --tilt: -.5deg; --tape: rgba(183,196,164,.75); }
  .card h3 { font-size: 2.1rem; }
  html:lang(ar) .card h3 { font-size: 1.6rem; }
  .card p { color: var(--ink-soft); }
  .card .note { align-self: flex-start; }
  .frame {
    position: relative;
    margin: 0;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px 14px 8px 12px / 12px 6px 14px 8px;
  }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hatch {
    display: none;
    position: absolute;
    inset: 0;
    place-items: center;
    background: repeating-linear-gradient(45deg, rgba(46,42,38,.2) 0 1.5px, transparent 1.5px 10px), var(--card);
  }
  .frame.missing img { display: none; }

      appsNote: 'صُنعت لقرّاء حسابي ✎',
      tradeLabel: 'خاص',
      tradeTitle: 'أنظمة لعالم الكتب',
      tradeBody: 'مبيعات ومخزون ومحاسبة لدار نشر ومكتبة، بالعربية والإنجليزية. يُبنى لفريق دار النشر نفسها، لذا يبقى خاصاً.',
      tradeNote: 'قيد العمل · للاستخدام الداخلي',
      hireTitle: 'هل تدير مكتبة أو دار نشر؟',
      hireBody: 'أبني الأنظمة الهادئة خلف الرفوف: المبيعات والمخزون، والمحاسبة، والفهارس الإلكترونية، وأدوات معارض الكتب. بالعناية نفسها التي أريدها لمكتبتي، بالعربية والإنجليزية.',
      hireCta: 'حدّثني عن مكتبتك',
      place: 'عمّان، الأردن',
      footWaraq: 'ورق',
      footEmail: 'راسلني',
      footElsewhere: 'تابعني',
      copyright: '© {year} ريم عيسى · القارئة التقنية',
    },
  };

  // One doodle per stop, in the same order as COPY.*.journey.
  const KINDS = ['bird', 'study', 'work', 'work', 'work', 'study', 'study'];

  function renderJourney(stops) {
    document.querySelector('.journey').replaceChildren(...stops.map((stop, i) => {
      const li = document.createElement('li');
      li.className = 'stop';
      li.innerHTML = `<svg class="doodle ${KINDS[i]}" aria-hidden="true"><use href="#i-${KINDS[i]}"/></svg>`
        + '<div class="stop-card"><span class="when"></span><h3></h3><span class="place"></span><p></p></div>';
      for (const [sel, key] of [['.when', 'when'], ['h3', 'title'], ['.place', 'place'], ['p', 'line']]) {
        const el = li.querySelector(sel);
        if (stop[key]) el.textContent = stop[key]; else el.remove();
      }
      return li;
    }));
  }

  const KEY = 'portfolio:lang';
  const toggle = document.querySelector('.lang-toggle');

  function setLang(lang) {
    const t = COPY[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    const year = new Date().getFullYear().toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US', { useGrouping: false });
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n].replace('{year}', year); });
    document.querySelectorAll('[data-i18n-alt]').forEach((el) => { el.alt = t[el.dataset.i18nAlt]; });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
    toggle.setAttribute('aria-label', t.toggle);
    renderJourney(t.journey);
    document.dispatchEvent(new Event('langchange'));
    toggle.querySelectorAll('span').forEach((s) => s.classList.toggle('on', s.lang === lang));
  }

  let lang = null;
  try { lang = localStorage.getItem(KEY); } catch (e) {}
  if (lang !== 'en' && lang !== 'ar') {
    lang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
  }
  setLang(lang);

  toggle.addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    setLang(lang);
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  });
</script>
<script type="module">
  // The journey as a 3D sketchbook to page through: newest stop first, one
  // spread per stop. three.js (self-hosted in /vendor/three) loads only when
  // the section comes near. If it can't run, the card list stays as it is.
  const section = document.getElementById('journey');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  new IntersectionObserver((entries, io) => {
    if (!entries.some((e) => e.isIntersecting)) return;
    io.disconnect();
    import('/vendor/three/three-journey.min.js').then(start).catch(() => {});
  }, { rootMargin: '600px 0px' }).observe(section);

  function start(THREE) {
    const book = section.querySelector('.book');
    const stage = book.querySelector('.book-stage');
    const prevBtn = book.querySelector('.book-prev');
    const nextBtn = book.querySelector('.book-next');
    const years = book.querySelector('.book-years');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: stage.querySelector('canvas'), antialias: true, alpha: true });
    } catch (e) {
      return;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const W = 1, H = 1.36, SEG = 28, GAP = 0.003;
    const TW = 768, TH = Math.round(TW * H);
    const INK = '#2E2A26', SOFT = '#4A403A', ROSE = '#8E4A51';
    const TAPE = { study: 'rgba(169,195,214,.8)', work: 'rgba(232,195,195,.85)', bird: 'rgba(183,196,164,.9)' };

    // Three looks to choose from while the design settles:
    // ?book=drawn (the default), ?book=notebook or ?book=minimal.
    const LOOKS = {
      drawn: { paper: '#FFFDF7', lines: false, tape: true, sketch: true, gutter: 0.07, light: [3.2, 0.3], board: { color: 0xF3EADC, pad: 0.012, radius: 0 } },
      notebook: { paper: '#FBF5EA', lines: true, tape: false, sketch: false, gutter: 0.22, light: [2.3, 1.2], board: { color: 0xA8636B, pad: 0.05, radius: 0.06 }, cloth: '#A8636B', edges: true, ribbon: true, shadow: true },
      minimal: { paper: '#FFFFFF', lines: false, tape: false, sketch: false, gutter: 0.1, light: [2.6, 0.8], board: null, shadow: true },
    };
    const look = LOOKS[new URLSearchParams(location.search).get('book')] || LOOKS.drawn;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cbb8, look.light[0]));
    const sun = new THREE.DirectionalLight(0xffffff, look.light[1]);
    sun.position.set(-1.5, 2, 4);
    scene.add(sun);

    const holder = new THREE.Group(); // tilts towards the pointer
    const pages = new THREE.Group(); // mirrored for Arabic, which opens the other way
    holder.rotation.x = -0.2;
    holder.add(pages);
    scene.add(holder);

    // What the pages rest on, depending on the look: a shadow, the cover
    // boards, the block of pages and a ribbon.
    if (look.shadow) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d'), glow = g.createRadialGradient(128, 128, 10, 128, 128, 128);
      glow.addColorStop(0, 'rgba(46,42,38,.35)');
      glow.addColorStop(1, 'rgba(46,42,38,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, 256, 256);
      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(W * 2.7, H * 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
      shadow.position.set(0, -0.05, -0.08);
      pages.add(shadow);
    }
    if (look.board) {
      const { color, pad, radius: r } = look.board;
      const w = W + pad, h = H + pad * 1.4, shape = new THREE.Shape();
      shape.moveTo(0, -h / 2);
      shape.lineTo(w - r, -h / 2);
      shape.quadraticCurveTo(w, -h / 2, w, -h / 2 + r);
      shape.lineTo(w, h / 2 - r);
      shape.quadraticCurveTo(w, h / 2, w - r, h / 2);
      shape.lineTo(0, h / 2);
      shape.lineTo(0, -h / 2);
      const material = new THREE.MeshLambertMaterial({ color });
      for (const side of [-1, 1]) {
        const cover = new THREE.Mesh(new THREE.ShapeGeometry(shape, 6), material);
        cover.scale.x = side;
        cover.position.z = -0.03;
        pages.add(cover);
      }
    }
    if (look.edges) {
      const material = new THREE.MeshLambertMaterial({ color: 0xEFE5D3 });
      for (const side of [-1, 1]) {
        const block = new THREE.Mesh(new THREE.BoxGeometry(W + 0.008, H, 0.025), material);
        block.position.set(side * (W + 0.008) / 2, 0, -0.014);
        pages.add(block);
      }
    }
    if (look.ribbon) {
      const ribbon = new THREE.Mesh(new THREE.PlaneGeometry(0.035, 0.26), new THREE.MeshLambertMaterial({ color: 0x8E4A51 }));
      ribbon.position.set(0.09, -H / 2 - 0.06, -0.004);
      pages.add(ribbon);
    }

    let lang = 'en', stops = [], leaves = [], current = 0, narrow = false;
    const ar = () => lang === 'ar';
    const num = (n) => n.toLocaleString(ar() ? 'ar-EG' : 'en-US');

    // A leaf is one sheet: its front faces up on the right, its back shows
    // on the left once turned. Both faces share one bendable plane.
    function makeLeaf() {
      const geo = new THREE.PlaneGeometry(W, H, SEG, 1);
      geo.translate(W / 2, 0, 0);
      const front = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ side: THREE.FrontSide }));
      const back = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ side: THREE.BackSide }));
      front.frustumCulled = back.frustumCulled = false;
      const group = new THREE.Group();
      group.add(front, back);
      pages.add(group);
      return { geo, front, back, group, p: 0, shown: -1 };
    }

    // Turn a leaf by p (0 flat on the right, 1 flat on the left), letting
    // its outer edge trail behind the spine so the paper curls.
    const xs = new Float32Array(SEG + 1), zs = new Float32Array(SEG + 1);
    function bend(leaf, k) {
      const p = leaf.p < 0.5 ? 2 * leaf.p * leaf.p : 1 - 2 * (1 - leaf.p) ** 2;
      if (p === leaf.shown) return;
      leaf.shown = p;
      const turn = p * Math.PI, lag = 0.55 * Math.sin(p * Math.PI), dx = W / SEG;
      for (let i = 1; i <= SEG; i++) {
        const a = turn - lag * ((i - 0.5) / SEG) ** 1.5;
        xs[i] = xs[i - 1] + Math.cos(a) * dx;
        zs[i] = zs[i - 1] + Math.sin(a) * dx;
      }
      const pos = leaf.geo.attributes.position;
      for (let v = 0; v < pos.count; v++) {
        const i = v % (SEG + 1);
        pos.setXYZ(v, xs[i], pos.getY(v), zs[i]);
      }
      pos.needsUpdate = true;
      leaf.geo.computeVertexNormals();
      leaf.group.position.z = GAP * ((1 - p) * (leaves.length - k) + p * k);
    }

    // Page drawing. Each sheet is drawn as it is seen; `spine` says which
    // edge sits at the spine, and `flip` corrects the texture for faces the
    // camera sees mirrored.
    const aniso = renderer.capabilities.getMaxAnisotropy();
    function texture(draw, flip) {
      const c = document.createElement('canvas');
      c.width = TW;
      c.height = TH;
      draw(c.getContext('2d'));
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = aniso;
      if (flip) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.repeat.x = -1;
        tex.offset.x = 1;
      }
      return tex;
    }

    function font(kind, size, weight = 700) {
      if (kind === 'hand') return ar() ? `${weight} ${size * 0.78}px "Aref Ruqaa", serif` : `${weight} ${size}px Caveat, cursive`;
      return ar() ? `${weight} ${size * 1.1}px Amiri, serif` : `${weight} ${size}px Lora, serif`;
    }

    function fit(ctx, kind, size, text, max) {
      ctx.font = font(kind, size);
      while (ctx.measureText(text).width > max && size > 20) ctx.font = font(kind, (size *= 0.92));
    }

    function wrap(ctx, text, max) {
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        const next = line ? line + ' ' + word : word;
        if (line && ctx.measureText(next).width > max) {
          lines.push(line);
          line = word;
        } else line = next;
      }
      if (line) lines.push(line);
      return lines;
    }

    function shade(ctx, spine) {
      const g = spine === 'left' ? ctx.createLinearGradient(0, 0, 110, 0) : ctx.createLinearGradient(TW, 0, TW - 110, 0);
      g.addColorStop(0, `rgba(46,42,38,${look.gutter})`);
      g.addColorStop(1, 'rgba(46,42,38,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, TW, TH);
    }

    // A wobbly ink line round the three free edges of a page.
    function sketch(ctx, spine) {
      const inset = 24, outer = spine === 'left' ? TW - inset : inset, inner = spine === 'left' ? 0 : TW;
      const corners = [[inner, inset], [outer, inset], [outer, TH - inset], [inner, TH - inset]];
      ctx.save();
      ctx.strokeStyle = INK;
      ctx.lineCap = ctx.lineJoin = 'round';
      for (const [pass, width, alpha] of [[0, 3.2, 1], [1, 1.6, 0.4]]) {
        ctx.lineWidth = width;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(...corners[0]);
        for (let c = 1; c < corners.length; c++) {
          const [x0, y0] = corners[c - 1], [x1, y1] = corners[c];
          for (let t = 1; t <= 12; t++) {
            const f = t / 12, wobble = Math.sin((c * 31 + t * 7 + pass * 13) * 1.7) * 2.2;
            ctx.lineTo(x0 + (x1 - x0) * f + (x0 === x1 ? wobble : 0), y0 + (y1 - y0) * f + (y0 === y1 ? wobble : 0));
          }
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function paper(ctx, spine) {
      ctx.fillStyle = look.paper;
      ctx.fillRect(0, 0, TW, TH);
      if (look.lines) {
        ctx.strokeStyle = 'rgba(169,195,214,.45)';
        ctx.lineWidth = 2;
        for (let y = 128; y < TH - 60; y += 48) {
          ctx.beginPath();
          ctx.moveTo(40, y);
          ctx.lineTo(TW - 40, y);
          ctx.stroke();
        }
      }
      shade(ctx, spine);
      if (look.sketch) sketch(ctx, spine);
    }

    function tape(ctx, color, x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-95, -26, 190, 52);
      ctx.restore();
    }

    // The same doodles as the card list, drawn twice like a pencil sketch.
    function doodle(ctx, kind, cx, cy, size, color) {
      const path = new Path2D(document.querySelector(`#i-${kind} path`).getAttribute('d'));
      ctx.save();
      ctx.translate(cx - size / 2, cy - size / 2);
      ctx.scale(size / 32, size / 32);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.stroke(path);
      ctx.globalAlpha = 0.35;
      ctx.translate(0.5, 0.4);
      ctx.stroke(path);
      ctx.restore();
    }

    function coverPage(spine) {
      return (ctx) => {
        if (look.cloth) {
          // Cloth: the cover colour with a faint weave.
          ctx.fillStyle = look.cloth;
          ctx.fillRect(0, 0, TW, TH);
          ctx.fillStyle = 'rgba(255,255,255,.05)';
          for (let i = 0; i < TW; i += 6) ctx.fillRect(i, 0, 2, TH);
          for (let i = 0; i < TH; i += 6) ctx.fillRect(0, i, TW, 2);
          shade(ctx, spine);
        } else paper(ctx, spine);
        const birds = look.cloth ? '#FBF5EA' : INK;
        doodle(ctx, 'bird', TW / 2 - 130, 250, 96, birds);
        doodle(ctx, 'bird', TW / 2 + 40, 200, 76, look.cloth ? '#F1E3E0' : ROSE);
        doodle(ctx, 'bird', TW / 2 + 150, 280, 60, birds);
        ctx.save();
        ctx.translate(TW / 2, 540);
        ctx.rotate(look.board ? -0.025 : 0);
        if (look.board) {
          ctx.fillStyle = '#FFFDF7';
          ctx.fillRect(-260, -150, 520, 300);
          ctx.strokeStyle = INK;
          ctx.lineWidth = 5;
          ctx.strokeRect(-260, -150, 520, 300);
        }
        if (look.tape) tape(ctx, TAPE.work, 0, -150, 0.04);
        ctx.direction = ar() ? 'rtl' : 'ltr';
        ctx.textAlign = 'center';
        ctx.fillStyle = INK;
        fit(ctx, 'hand', 116, COPY[lang].journeyTitle, 460);
        ctx.fillText(COPY[lang].journeyTitle, 0, 10);
        ctx.fillStyle = ROSE;
        ctx.font = font('hand', 56);
        ctx.fillText(COPY[lang].journeyNote, 0, 95);
        ctx.restore();
      };
    }

    function picturePage(stop, kind, spine) {
      return (ctx) => {
        paper(ctx, spine);
        if (look.tape) tape(ctx, TAPE[kind], TW / 2, 70, -0.05);
        ctx.direction = ar() ? 'rtl' : 'ltr';
        ctx.textAlign = 'center';
        ctx.fillStyle = INK;
        if (ar()) fit(ctx, 'body', 92, stop.when, TW - 180);
        else fit(ctx, 'hand', 136, stop.when, TW - 180);
        ctx.fillText(stop.when, TW / 2, 330);
        doodle(ctx, kind, TW / 2, 620, 300, kind === 'bird' ? ROSE : INK);
      };
    }

    function textPage(stop, i, spine) {
      return (ctx) => {
        paper(ctx, spine);
        const left = spine === 'left' ? 110 : 76, right = TW - (spine === 'left' ? 76 : 110);
        const x = ar() ? right : left, max = right - left;
        ctx.direction = ar() ? 'rtl' : 'ltr';
        ctx.textAlign = 'start';
        let y = 180;
        ctx.fillStyle = ROSE;
        ctx.font = ar() ? font('body', 38) : font('hand', 56);
        ctx.fillText(stop.when, x, y);
        y += 100;
        ctx.fillStyle = INK;
        ctx.font = font('hand', 84);
        for (const line of wrap(ctx, stop.title, max)) {
          ctx.fillText(line, x, y);
          y += ar() ? 96 : 86;
        }
        y += 10;
        ctx.fillStyle = SOFT;
        if (stop.place) {
          ctx.font = font('body', 34);
          for (const line of wrap(ctx, stop.place, max)) {
            ctx.fillText(line, x, y);
            y += 56;
          }
          y += 26;
        }
        if (stop.line) {
          ctx.font = font('body', 36, 400);
          for (const line of wrap(ctx, stop.line, max)) {
            ctx.fillText(line, x, y);
            y += ar() ? 70 : 62;
          }
        }
        ctx.textAlign = 'center';
        ctx.font = font('hand', 40);
        ctx.fillText(`${num(i + 1)} / ${num(stops.length)}`, TW / 2, TH - 70);
      };
    }

    // Leaf 0 is the cover. Turning leaf k shows stop k: its picture on the
    // back of leaf k, its words on the front of leaf k + 1.
    function paint() {
      const frontSpine = ar() ? 'right' : 'left', backSpine = ar() ? 'left' : 'right';
      leaves.forEach((leaf, k) => {
        const front = k === 0 ? coverPage(frontSpine) : textPage(stops[k - 1], k - 1, frontSpine);
        const back = k < stops.length ? picturePage(stops[k], KINDS[k], backSpine) : (ctx) => paper(ctx, backSpine);
        for (const [mesh, draw, flip] of [[leaf.front, front, ar()], [leaf.back, back, !ar()]]) {
          if (mesh.material.map) mesh.material.map.dispose();
          mesh.material.map = texture(draw, flip);
          mesh.material.needsUpdate = true;
        }
      });
    }

    function layout() {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      narrow = w < 640;
      // Phones see one page, the one with the words; wider screens the spread.
      const fitW = narrow ? W * 1.12 : W * 2.2, fitH = H * 1.18;
      const t = Math.tan((camera.fov * Math.PI) / 360);
      camera.position.set(0, 0, Math.max(fitH / 2 / t, fitW / 2 / (t * camera.aspect)));
      camera.updateProjectionMatrix();
      pages.scale.x = ar() ? -1 : 1;
      pages.position.x = narrow ? (ar() ? W / 2 : -W / 2) : 0;
      kick();
    }

    function chips() {
      years.replaceChildren(...stops.map((stop, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = stop.when;
        b.addEventListener('click', () => go(i + 1));
        return b;
      }));
    }

    function go(n) {
      current = Math.max(0, Math.min(stops.length, n));
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === stops.length;
      years.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i + 1 === current)));
      kick();
    }

    // Older stops are further into the book: to the right in English, to
    // the left in Arabic.
    prevBtn.addEventListener('click', () => go(current - 1));
    nextBtn.addEventListener('click', () => go(current + 1));
    book.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      go(current + ((e.key === 'ArrowRight') !== ar() ? 1 : -1));
    });

    let downX = null, tiltX = 0, tiltY = 0;
    stage.addEventListener('pointerdown', (e) => { downX = e.clientX; });
    stage.addEventListener('pointercancel', () => { downX = null; });
    stage.addEventListener('pointerup', (e) => {
      if (downX === null) return;
      const dx = e.clientX - downX;
      downX = null;
      if (Math.abs(dx) > 40) go(current + ((dx < 0) !== ar() ? 1 : -1));
      else if (Math.abs(dx) < 8) {
        const r = stage.getBoundingClientRect();
        go(current + (narrow || (e.clientX > r.left + r.width / 2) !== ar() ? 1 : -1));
      }
    });
    stage.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const r = stage.getBoundingClientRect();
      tiltX = (e.clientX - r.left) / r.width - 0.5;
      tiltY = (e.clientY - r.top) / r.height - 0.5;
      kick();
    });
    stage.addEventListener('pointerleave', () => { tiltX = tiltY = 0; kick(); });

    // Draw only while something moves.
    let running = false, last = 0;
    function kick() {
      if (running) return;
      running = true;
      last = performance.now();
      requestAnimationFrame(tick);
    }
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      let moving = false;
      leaves.forEach((leaf, k) => {
        const target = k < current ? 1 : 0;
        if (leaf.p !== target) {
          // When jumping several stops, each leaf waits for the one before it.
          const waiting = target === 1 ? k > 0 && leaves[k - 1].p < 0.3 : k < leaves.length - 1 && leaves[k + 1].p > 0.7;
          if (reduce) leaf.p = target;
          else if (!waiting) leaf.p = target === 1 ? Math.min(1, leaf.p + dt * 1.7) : Math.max(0, leaf.p - dt * 1.7);
          moving = moving || leaf.p !== target;
        }
        bend(leaf, k);
      });
      const rx = -0.2 + (reduce ? 0 : tiltY * 0.12), ry = reduce ? 0 : tiltX * 0.25;
      holder.rotation.x += (rx - holder.rotation.x) * Math.min(1, dt * 6);
      holder.rotation.y += (ry - holder.rotation.y) * Math.min(1, dt * 6);
      if (Math.abs(rx - holder.rotation.x) + Math.abs(ry - holder.rotation.y) > 0.0005) moving = true;
      renderer.render(scene, camera);
      if (moving) requestAnimationFrame(tick);
      else running = false;
    }

    async function load() {
      lang = document.documentElement.lang === 'ar' ? 'ar' : 'en';
      stops = COPY[lang].journey;
      const sample = COPY[lang].journeyTitle + ' ' + stops.map((s) => Object.values(s).join(' ')).join(' ');
      const faces = ar() ? ['700 40px "Aref Ruqaa"', '400 40px Amiri', '700 40px Amiri'] : ['700 40px Caveat', '400 40px Lora', '700 40px Lora'];
      await Promise.all(faces.map((f) => document.fonts.load(f, sample))).catch(() => {});
      if (!leaves.length) leaves = Array.from({ length: stops.length + 1 }, makeLeaf);
      paint();
      chips();
      go(current);
      layout();
    }
    document.addEventListener('langchange', load);

    load().then(() => {
      section.classList.add('has-book');
      book.hidden = false;
      layout();
      new ResizeObserver(layout).observe(stage);
      // Open at the newest stop the first time the book is in view.
      new IntersectionObserver((entries, io) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        io.disconnect();
        setTimeout(() => { if (current === 0) go(1); }, reduce ? 0 : 500);
      }, { threshold: 0.4 }).observe(stage);
    });
  }
</script>
</body>
</html>
